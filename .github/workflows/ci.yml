name: Test Windows app

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate ChatGPT browser extension
        shell: pwsh
        run: |
          function Invoke-NodeChecked {
            param([string[]]$Arguments)
            & node @Arguments
            if ($LASTEXITCODE -ne 0) {
              throw "node $($Arguments -join ' ') failed with exit code $LASTEXITCODE."
            }
          }

          $manifest = Get-Content .\browser-extension\manifest.json -Raw | ConvertFrom-Json
          if ($manifest.manifest_version -ne 3 -or
              $manifest.permissions -notcontains 'nativeMessaging' -or
              $manifest.host_permissions.Count -ne 1 -or
              $manifest.host_permissions[0] -ne 'https://chatgpt.com/*') {
            throw 'Browser extension permissions or host scope are invalid.'
          }

          Invoke-NodeChecked -Arguments @('--check', '.\browser-extension\background.js')
          Invoke-NodeChecked -Arguments @('--check', '.\browser-extension\completion-state.js')
          Invoke-NodeChecked -Arguments @('--check', '.\browser-extension\recovery-watchdog.js')
          Invoke-NodeChecked -Arguments @('--check', '.\browser-extension\recovery-dom.js')
          Invoke-NodeChecked -Arguments @('--check', '.\browser-extension\recovery-action-controller.js')
          Invoke-NodeChecked -Arguments @('--check', '.\browser-extension\runtime-messaging.js')
          Invoke-NodeChecked -Arguments @('--check', '.\browser-extension\content.js')
          Invoke-NodeChecked -Arguments @('--check', '.\browser-extension\tab-focus.js')
          Invoke-NodeChecked -Arguments @('.\tests\browser-extension\completion-state.test.js')
          Invoke-NodeChecked -Arguments @('.\tests\browser-extension\runtime-messaging.test.js')
          Invoke-NodeChecked -Arguments @('.\tests\browser-extension\content-runtime.test.js')
          Invoke-NodeChecked -Arguments @('.\tests\browser-extension\manifest.test.js')
          Invoke-NodeChecked -Arguments @('.\tests\browser-extension\tab-focus.test.js')
          Invoke-NodeChecked -Arguments @('.\tests\browser-extension\recovery-watchdog.test.js')
          Invoke-NodeChecked -Arguments @('.\tests\browser-extension\recovery-dom.test.js')
          Invoke-NodeChecked -Arguments @('.\tests\browser-extension\recovery-action-controller.test.js')
          Invoke-NodeChecked -Arguments @('.\tests\browser-extension\recovery-content-runtime.test.js')

      - name: Test Windows PowerShell compatibility and installers
        shell: pwsh
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
              -File .\tests\PowerShellInstaller.Tests.ps1
          if ($LASTEXITCODE -ne 0) {
              throw "PowerShell installer tests failed with exit code $LASTEXITCODE."
          }

      - name: Test desktop shortcut integration
        shell: pwsh
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
              -File .\tests\DesktopShortcut.Tests.ps1
          if ($LASTEXITCODE -ne 0) {
              throw "Desktop shortcut tests failed with exit code $LASTEXITCODE."
          }

      - name: Validate recovery release wiring
        shell: pwsh
        run: |
          $manifest = Get-Content .\browser-extension\manifest.json -Raw | ConvertFrom-Json
          $releaseVersion = (Get-Content .\.release-version -Raw).Trim()
          $expectedReleaseVersion = "v$($manifest.version)"
          if ($releaseVersion -ne $expectedReleaseVersion) {
            throw "Release versions are inconsistent: extension=$($manifest.version), release=$releaseVersion"
          }

          $releaseWorkflow = Get-Content .\.github\workflows\release.yml -Raw
          $installer = Get-Content .\scripts\install-release.ps1 -Raw
          $builder = Get-Content .\scripts\build-windows.ps1 -Raw
          foreach ($term in @(
              'CodexUsageTray.RecoveryRunner.exe',
              'CodexUsageTray.RecoveryRunner.csproj',
              'recovery-action-controller.js')) {
            if (-not $releaseWorkflow.Contains($term)) {
              throw "Release workflow is missing recovery artifact wiring: $term"
            }
          }
          if (-not $installer.Contains("'CodexUsageTray.RecoveryRunner.exe'")) {
            throw 'Installer is missing optional RecoveryRunner wiring.'
          }
          if (-not $builder.Contains('CodexUsageTray.RecoveryRunner.exe')) {
            throw 'Windows builder is missing RecoveryRunner publication validation.'
          }

      - name: Test core logic
        shell: pwsh
        run: |
          dotnet run --configuration Release `
              --project .\tests\CodexUsageTray.Core.Tests\CodexUsageTray.Core.Tests.csproj
          if ($LASTEXITCODE -ne 0) {
              throw "Core tests failed with exit code $LASTEXITCODE."
          }

      - name: Test recovery logic
        shell: pwsh
        run: |
          dotnet run --configuration Release `
              --project .\tests\CodexUsageTray.Recovery.Tests\CodexUsageTray.Recovery.Tests.csproj
          if ($LASTEXITCODE -ne 0) {
              throw "Recovery tests failed with exit code $LASTEXITCODE."
          }

      - name: Test RecoveryRunner logic
        shell: pwsh
        run: |
          dotnet run --configuration Release `
              --project .\tests\CodexUsageTray.RecoveryRunner.Tests\CodexUsageTray.RecoveryRunner.Tests.csproj
          if ($LASTEXITCODE -ne 0) {
              throw "RecoveryRunner tests failed with exit code $LASTEXITCODE."
          }

      - name: Test Windows UI regressions
        shell: pwsh
        run: |
          dotnet run --configuration Release `
              --project .\tests\CodexUsageTray.Windows.Tests\CodexUsageTray.Windows.Tests.csproj
          if ($LASTEXITCODE -ne 0) {
            throw "Windows UI regression tests failed with exit code $LASTEXITCODE."
          }

      - name: Build tray and event bridge
        shell: pwsh
        run: |
          dotnet build .\CodexUsageTray.sln --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "Windows solution build failed with exit code $LASTEXITCODE."
          }

          $bridgePath = Get-ChildItem `
              -LiteralPath .\src\CodexUsageTray.EventBridge\bin\Release `
              -Filter CodexUsageTray.EventBridge.exe `
              -File `
              -Recurse |
              Select-Object -First 1 -ExpandProperty FullName
          if (-not $bridgePath) {
            throw 'Built EventBridge executable was not found.'
          }
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
              -File .\tests\EventBridgeHook.Tests.ps1 `
              -BridgePath $bridgePath
          if ($LASTEXITCODE -ne 0) {
            throw "EventBridge Hook integration tests failed with exit code $LASTEXITCODE."
          }
