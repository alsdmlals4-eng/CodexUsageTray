name: Test Windows app

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate ChatGPT browser extension
        shell: pwsh
        run: |
          $manifest = Get-Content .\browser-extension\manifest.json -Raw | ConvertFrom-Json
          if ($manifest.manifest_version -ne 3 -or
              $manifest.permissions -notcontains 'nativeMessaging' -or
              $manifest.host_permissions.Count -ne 1 -or
              $manifest.host_permissions[0] -ne 'https://chatgpt.com/*') {
            throw 'Browser extension permissions or host scope are invalid.'
          }
          node --check .\browser-extension\background.js
          node --check .\browser-extension\content.js

      - name: Test Windows PowerShell compatibility and installers
        shell: pwsh
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
              -File .\tests\PowerShellInstaller.Tests.ps1
          if ($LASTEXITCODE -ne 0) {
              throw "PowerShell installer tests failed with exit code $LASTEXITCODE."
          }

      - name: Test core logic
        shell: pwsh
        run: |
          dotnet run --configuration Release `
              --project .\tests\CodexUsageTray.Core.Tests\CodexUsageTray.Core.Tests.csproj
          if ($LASTEXITCODE -ne 0) {
              throw "Core tests failed with exit code $LASTEXITCODE."
          }

      - name: Test Windows UI regressions
        shell: pwsh
        run: |
          dotnet run --configuration Release `
              --project .\tests\CodexUsageTray.Windows.Tests\CodexUsageTray.Windows.Tests.csproj
          if ($LASTEXITCODE -ne 0) {
            throw "Windows UI regression tests failed with exit code $LASTEXITCODE."
          }

      - name: Build tray and event bridge
        shell: pwsh
        run: |
          dotnet build .\CodexUsageTray.sln --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "Windows solution build failed with exit code $LASTEXITCODE."
          }
